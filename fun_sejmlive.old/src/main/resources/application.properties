FB_TOKEN=${FACEBOOK_TOKEN:${fb-token:}}
spring.application.name=demo

# Azure Key Vault (auto-enabled when endpoint can be resolved at startup)
# Single source of truth for endpoint: AZURE_KEYVAULT_ENDPOINT (recommended),
# with legacy fallback aliases for compatibility.
spring.cloud.azure.keyvault.secret.property-source-enabled=${AZURE_KEYVAULT_ENABLED:false}
spring.cloud.azure.keyvault.secret.property-sources[0].name=sejmstream-keyvault
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=${AZURE_KEYVAULT_ENDPOINT:${AZURE_KEYVAULT_URI:${KEY_VAULT_URI:${KEYVAULT_URI:}}}}

# PostgreSQL configuration
spring.datasource.url=${DB_URL:${spring-datasource-url:}}
spring.datasource.username=${DB_USERNAME:${spring-datasource-username:}}
spring.datasource.password=${DB_PASSWORD:${spring-datasource-password:}}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.show-sql=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
