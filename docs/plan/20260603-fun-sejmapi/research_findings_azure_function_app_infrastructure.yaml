patterns_found:
  - category: "structure"
    pattern: "Shared foundational Azure resources live in `infra/main.tf` without modules"
    description: "The current Terraform stack keeps all Azure resources in a single top-level file and relies on locals for naming rather than splitting domains into submodules."
    examples:
      - file: "/sejmstream/infra/main.tf"
        location: "/sejmstream/infra/main.tf:8"
        snippet: "locals { ... resource_prefix = \"${local.name_prefix}-${local.environment}\" ... }"
    prevalence: "common"
  - category: "naming"
    pattern: "Environment-prefixed resource naming"
    description: "Azure resource names are built from `sejmstr`, `dev`, and a shared random suffix where global uniqueness is needed."
    examples:
      - file: "/sejmstream/infra/main.tf"
        location: "/sejmstream/infra/main.tf:10"
        snippet: "resource_prefix = \"${local.name_prefix}-${local.environment}\""
      - file: "/sejmstream/infra/main.tf"
        location: "/sejmstream/infra/main.tf:24"
        snippet: "key_vault_name = \"${local.name_prefix}-${local.environment}-kv-${local.global_suffix}\""
    prevalence: "common"
  - category: "architecture"
    pattern: "Reuse shared platform resources through outputs and runtime env"
    description: "Current runtime guidance flows infrastructure values out of Terraform and into application runtime settings instead of hardcoding names."
    examples:
      - file: "/sejmstream/infra/outputs.tf"
        location: "/sejmstream/infra/outputs.tf:33"
        snippet: "output \"key_vault_uri\" { value = azurerm_key_vault.main.vault_uri }"
      - file: "/sejmstream/infra/README.md"
        location: "/sejmstream/infra/README.md:53"
        snippet: "Use Terraform output `key_vault_uri` as the single source of truth"
    prevalence: "common"
  - category: "error_handling"
    pattern: "Remote Terraform runs are expected to fail without proper workspace auth"
    description: "The repo explicitly documents Terraform Cloud authentication as a prerequisite because `use_cli = false` disables local CLI fallback in remote runs."
    examples:
      - file: "/sejmstream/infra/providers.tf"
        location: "/sejmstream/infra/providers.tf:31"
        snippet: "use_cli  = false"
      - file: "/sejmstream/infra/README.md"
        location: "/sejmstream/infra/README.md:41"
        snippet: "remote runs will not try to authenticate through Azure CLI"
    prevalence: "common"
  - category: "architecture"
    pattern: "Application configuration secrets are stored in Key Vault, not in Terraform outputs"
    description: "Sensitive values are written into Key Vault and only secret IDs or URIs are exposed as outputs."
    examples:
      - file: "/sejmstream/infra/main.tf"
        location: "/sejmstream/infra/main.tf:104"
        snippet: "resource \"azurerm_key_vault_secret\" \"spring_datasource_url\""
      - file: "/sejmstream/infra/outputs.tf"
        location: "/sejmstream/infra/outputs.tf:50"
        snippet: "output \"facebook_token_secret_versionless_id\""
    prevalence: "common"
