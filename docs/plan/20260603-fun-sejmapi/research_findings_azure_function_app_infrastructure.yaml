      source: "/sejmstream/infra/README.md:45"
    - check: "main branch infra workflow behavior"
      result: "documented"
      detail: "Repo documentation states that pushes to `main` run `terraform fmt`, `terraform validate`, and remote `terraform apply`."
      source: "/sejmstream/infra/README.md:46"
  validation_targets_for_new_slice:
