plan_id: "20260603-fun-sejmapi"
objective: "Prepare executable Terraform task breakdown for hosting fun_sejmapi as Java Durable Functions"
focus_area: "Azure Function App infrastructure"
created_at: "2026-06-03"
created_by: "GitHub Copilot GPT-5.4"
status: "completed"
tldr: |
  - The current Terraform stack already provisions a shared resource group, Log Analytics workspace, Container Apps environment, ACR, and Key Vault, but no Function App, hosting plan, storage account, or related RBAC resources exist yet.
  - Approved kickoff scope requires Terraform expansion for a separate `fun_sejmapi` Durable Functions app on Java 21 while avoiding unrelated ACA changes.
  - Local provider schema inspection confirms the core Terraform resources available for this slice: `azurerm_service_plan`, `azurerm_storage_account`, `azurerm_linux_function_app`, and `azurerm_role_assignment`.
  - Microsoft Durable documentation confirms that Durable Functions needs durable state storage and that the Azure Storage provider persists orchestration state in blobs, queues, and tables.
  - Current Terraform validation succeeds after local provider initialization; remote execution remains anchored to the existing Terraform Cloud workspace and OIDC-based Azure authentication.
research_metadata:
  methodology: "kickoff notes + repo memory + grep_search + targeted read_file + local terraform init/validate + local azurerm provider schema inspection + Microsoft Learn doc extraction"
  scope: "Current Terraform topology, Azure Function App resource requirements, Durable storage requirements, identity-based storage access, repo validation path, and files implicated by first-iteration Function App provisioning"
  confidence: "high"
  coverage: 95
  decision_blockers: 3
  research_blockers: 0
