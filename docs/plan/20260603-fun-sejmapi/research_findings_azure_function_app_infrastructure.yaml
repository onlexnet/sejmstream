dependencies:
  internal:
    - name: "Shared naming locals and tag conventions"
      detail: "New resources are expected to follow `resource_prefix`, `global_suffix`, and `common_tags` conventions from `infra/main.tf`."
      sources:
        - "/sejmstream/infra/main.tf:8"
    - name: "Shared resource group"
      detail: "Function App resources are scoped to the existing resource group."
      sources:
        - "/sejmstream/infra/main.tf:30"
    - name: "Shared Key Vault output contract"
      detail: "Runtime configuration currently flows from Terraform outputs into environment variables, especially `key_vault_uri`."
      sources:
        - "/sejmstream/infra/outputs.tf:33"
        - "/sejmstream/infra/README.md:53"
    - name: "Future `fun_sejmapi` module artifact"
      detail: "The Function App infrastructure exists to host a module that is approved but not yet present in the Maven reactor."
      sources:
        - "/sejmstream/pom.xml:18"
        - "/sejmstream/docs/plan/20260603-fun-sejmapi/kickoff-decisions-20260603.md:15"
  external:
    - name: "Terraform Cloud workspace auth"
      detail: "Remote plans and applies require workspace-level Azure authentication because the provider disables CLI auth for remote execution."
      sources:
        - "/sejmstream/infra/providers.tf:31"
        - "/sejmstream/infra/README.md:41"
    - name: "Azure Storage provider for Durable Functions"
      detail: "Durable orchestration state on Azure Storage depends on blobs, queues, and tables inside the storage account."
      sources:
        - "Microsoft Learn Durable Task storage provider documentation"
    - name: "Identity-based AzureWebJobsStorage settings"
      detail: "Managed-identity host storage uses `AzureWebJobsStorage__credential=managedidentity` and related account/service URI settings instead of only a connection string."
      sources:
        - "Microsoft Learn Azure Functions app settings reference"
    - name: "Storage account RBAC for identity-based host storage"
      detail: "Microsoft documentation explicitly calls out `Storage Account Contributor`, `Storage Blob Data Owner`, and `Storage Queue Data Contributor` for the `AzureWebJobsStorage` connection when identity-based access is used."
      sources:
        - "Microsoft Learn Azure Functions identity-based host storage documentation"
risks:
  - risk: "Hosting plan SKU remains an undecided infrastructure input"
    impact: "decision_blocker"
    detail: "The provider schema confirms a service plan is needed and requires `os_type` and `sku_name`, but the repo has no existing variable or approved decision for the first-iteration Function App plan SKU."
    sources:
      - "local azurerm provider schema inspection for `azurerm_service_plan`"
      - "/sejmstream/infra/variables.tf:1"
  - risk: "Identity-based host storage raises RBAC complexity"
    impact: "decision_blocker"
    detail: "Using managed identity for `AzureWebJobsStorage` requires extra storage roles; missing one of the documented roles can prevent normal host or Durable runtime behavior."
    sources:
      - "Microsoft Learn Azure Functions identity-based host storage documentation"
  - risk: "No deployable `fun_sejmapi` artifact exists yet"
    impact: "research_blocker"
    detail: "The infrastructure can be described, but deployment-specific settings such as package location and any module-specific application settings cannot be fully grounded until the module exists."
    sources:
      - "/sejmstream/pom.xml:18"
      - "/sejmstream/docs/plan/20260603-fun-sejmapi/kickoff-decisions-20260603.md:15"
  - risk: "Remote Terraform execution may fail even when local validation passes"
    impact: "decision_blocker"
    detail: "The repo documents that remote runs depend on Terraform Cloud Azure credentials and do not use local CLI auth. New Function App resource types remain subject to that workspace configuration."
    sources:
      - "/sejmstream/infra/providers.tf:31"
      - "/sejmstream/infra/README.md:41"
  - risk: "Function App monitoring contract is only partially specified"
    impact: "nice_to_know"
    detail: "The first iteration explicitly reuses Log Analytics, but the current Terraform stack has no Function App-specific monitoring resource or setting pattern to mirror."
    sources:
      - "/sejmstream/infra/main.tf:42"
      - "task clarification: reuse existing Log Analytics"
