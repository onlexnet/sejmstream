tldr: |
  Build the work in seven waves so implementation can proceed in parallel where files do not overlap while keeping runtime dependencies realistic.
  Start with two independent foundations: Maven module wiring and Terraform hosting primitives only.
  Then lock local Durable runtime prerequisites, implement the Durable contract, wire Terraform runtime settings only after that contract exists, and finalize CI, review, and docs.
  The plan deliberately keeps demo scope intact: no real Sejm API calls, no database integration, and no CD automation. Sources: S1, S2, S3, S4.
