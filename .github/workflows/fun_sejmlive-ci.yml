name: fun_sejmlive CI

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'fun_sejmlive/**'
      - 'fun_sejmlive/pom.xml'
      - '.github/workflows/fun_sejmlive-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'fun_sejmlive/**'
      - 'fun_sejmlive/pom.xml'
      - '.github/workflows/fun_sejmlive-ci.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build-test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21 (Temurin) with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set build version
        id: build_version
        run: echo "value=$(date +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Run verification suite (unit, architecture, integration)
        run: mvn -B -q -f fun_sejmlive/pom.xml verify -Dbuild.version=${{ steps.build_version.outputs.value }}

      - name: Package fun_sejmlive Azure Functions artifact from its own pom.xml
        run: mvn -B -q -f fun_sejmlive/pom.xml -DskipTests package -Dbuild.version=${{ steps.build_version.outputs.value }}

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun_sejmlive-surefire-reports
          path: fun_sejmlive/target/surefire-reports/**
          if-no-files-found: warn

      - name: Prepare Azure Functions deployment package
        if: success()
        run: |
          rm -rf fun_sejmlive-package
          mkdir -p fun_sejmlive-package
          cp -R fun_sejmlive/target/azure-functions/sejmstream-fun-sejmlive-local/. fun_sejmlive-package/
          rm -f fun_sejmlive-package/local.settings.json

      - name: Upload Azure Functions package output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fun_sejmlive-azure-functions-package
          path: fun_sejmlive-package/**
          if-no-files-found: error

  deploy-main:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build-test-and-package
    runs-on: ubuntu-latest
    environment: prod
    env:
      AZURE_FUNCTIONAPP_NAME: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}

    steps:
      - name: Download Azure Functions package artifact
        uses: actions/download-artifact@v4
        with:
          name: fun_sejmlive-azure-functions-package
          path: fun_sejmlive-package

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy package to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: fun_sejmlive-package