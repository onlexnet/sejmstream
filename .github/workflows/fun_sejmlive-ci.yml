name: fun_sejmlive CI

on:
  push:
    branches:
      - main
    paths:
      - 'fun_sejmlive/**'
      - 'pom.xml'
      - '.github/workflows/fun_sejmlive-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'fun_sejmlive/**'
      - 'pom.xml'
      - '.github/workflows/fun_sejmlive-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile and test fun_sejmlive module (with retry)
        shell: bash
        run: |
          max_attempts=3
          attempt=1

          while [[ $attempt -le $max_attempts ]]; do
            echo "Running tests (attempt $attempt/$max_attempts)..."

            if mvn -B -q -pl fun_sejmlive -am test; then
              echo "Tests passed on attempt $attempt."
              exit 0
            fi

            if [[ $attempt -lt $max_attempts ]]; then
              echo "Tests failed on attempt $attempt. Retrying..."
            fi

            attempt=$((attempt + 1))
          done

          echo "Tests failed after $max_attempts attempts."
          exit 1

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun_sejmlive-surefire-reports
          path: fun_sejmlive/target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fun_sejmlive-jar
          path: fun_sejmlive/target/*.jar
          if-no-files-found: warn
