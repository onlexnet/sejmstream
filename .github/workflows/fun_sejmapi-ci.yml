name: fun_sejmapi CI

'on':
  push:
    branches:
      - main
    paths:
      - 'fun_sejmapi/**'
      - 'pom.xml'
      - '.github/workflows/fun_sejmapi-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'fun_sejmapi/**'
      - 'pom.xml'
      - '.github/workflows/fun_sejmapi-ci.yml'

permissions:
  contents: read

jobs:
  build-test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run fun_sejmapi tests from root reactor
        run: mvn -B -q -pl fun_sejmapi -am test

      - name: Package fun_sejmapi Azure Functions artifact from root reactor
        run: mvn -B -q -pl fun_sejmapi -am -DskipTests package

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun_sejmapi-surefire-reports
          path: fun_sejmapi/target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload Azure Functions package output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fun_sejmapi-azure-functions-package
          path: |
            fun_sejmapi/target/azure-functions/sejmstream-fun-sejmapi-local/host.json
            fun_sejmapi/target/azure-functions/sejmstream-fun-sejmapi-local/bin/**
            fun_sejmapi/target/azure-functions/sejmstream-fun-sejmapi-local/**/function.json
            !fun_sejmapi/target/azure-functions/sejmstream-fun-sejmapi-local/local.settings.json
          if-no-files-found: error