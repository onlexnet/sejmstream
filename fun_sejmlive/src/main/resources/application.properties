spring.threads.virtual.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}

interpellation.publish.queue.name=${INTERPELLATION_PUBLISH_QUEUE_NAME:sejm-interpellations-publish}
interpellation.publish.queue.dead-letter-name=${INTERPELLATION_PUBLISH_DEAD_LETTER_QUEUE_NAME:sejm-interpellations-publish-deadletter}
interpellation.publish.queue.max-attempts=${INTERPELLATION_PUBLISH_MAX_ATTEMPTS:5}
interpellation.publish.queue.retry-delay-seconds=${INTERPELLATION_PUBLISH_RETRY_DELAY_SECONDS:60}
interpellation.publish.queue.backoff-multiplier=${INTERPELLATION_PUBLISH_BACKOFF_MULTIPLIER:2.0}
interpellation.publish.queue.max-retry-delay-seconds=${INTERPELLATION_PUBLISH_MAX_RETRY_DELAY_SECONDS:900}
