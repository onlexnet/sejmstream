databaseChangeLog:
  - changeSet:
      id: 005-extend-interpellation-state-statuses
      author: sejmstream
      changes:
        - sql:
            sql: ALTER TABLE sejm_interpellation_publish_state DROP CONSTRAINT chk_interpellation_publish_state_status
        - sql:
            sql: ALTER TABLE sejm_interpellation_publish_state ADD CONSTRAINT chk_interpellation_publish_state_status CHECK (status IN ('QUEUED', 'PROCESSING', 'RETRY_SCHEDULED', 'PUBLISHED', 'DEAD_LETTER', 'PUBLISH_CONFIRMATION_PENDING', 'QUEUE_ENQUEUE_FAILED'))