openapi: 3.0.3
info:
  title: Sejm API Demo Durable Functions
  version: 1.0.0
  description: Demo-only Durable Functions workflow endpoints for Sejm API scaffolding.
servers:
  - url: /
    description: Current host
paths:
  /api/sejm-api/simple:
    get:
      summary: Sejm API simple data
      description: Returns the live Sejm terms dataset from the public Sejm API.
      operationId: getSejmSimpleData
      responses:
        '200':
          description: Live Sejm term list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SejmTerm'
  /api/Fun_HttpStart:
    post:
      summary: Start demo durable orchestration
      description: Starts a new orchestration and returns status-query URLs.
      security:
        - functionKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoWorkflowRequest'
      responses:
        '202':
          description: Accepted. Includes durable status URLs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  statusQueryGetUri:
                    type: string
                  sendEventPostUri:
                    type: string
                  terminatePostUri:
                    type: string
                  rewindPostUri:
                    type: string
                  purgeHistoryDeleteUri:
                    type: string
        '401':
          description: Unauthorized. Provide a valid function key via the x-functions-key header.
  /api/Fun_CollectStart:
    post:
      summary: Start Sejm data collection orchestration
      description: Starts the SejmData durable collection workflow and returns status-query URLs.
      operationId: startSejmDataCollection
      security:
        - functionKey: []
      responses:
        '202':
          description: Accepted. Includes durable status URLs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  statusQueryGetUri:
                    type: string
                  sendEventPostUri:
                    type: string
                  terminatePostUri:
                    type: string
                  rewindPostUri:
                    type: string
                  purgeHistoryDeleteUri:
                    type: string
        '401':
          description: Unauthorized. Provide a valid function key via the x-functions-key header.
  /api/Fun_FacebookPublishStart:
    post:
      summary: Publish Sejm daily digest to Facebook
      description: Triggers manual publishing of the daily Sejm digest to Facebook.
      operationId: publishSejmDailyDigestToFacebook
      security:
        - functionKey: []
      responses:
        '200':
          description: Digest publish completed or skipped with status details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacebookPublishResponse'
        '401':
          description: Unauthorized. Provide a valid function key via the x-functions-key header.
        '500':
          description: Publish failed.
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    functionKey:
      type: apiKey
      in: header
      name: x-functions-key
      description: Azure Function key. Obtain from Azure Portal under Functions -> App keys or Function keys.
  schemas:
    SejmTerm:
      type: object
      properties:
        current:
          type: boolean
        from:
          type: string
          format: date
        num:
          type: integer
        prints:
          $ref: '#/components/schemas/SejmPrints'
        to:
          type: string
          format: date
    SejmPrints:
      type: object
      properties:
        count:
          type: integer
        lastChanged:
          type: string
          format: date-time
        link:
          type: string
    DemoWorkflowRequest:
      type: object
      properties:
        correlationId:
          type: string
          example: demo-123
        sampleSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
          example: 3
    DemoWorkflowResult:
      type: object
      properties:
        correlationId:
          type: string
        source:
          type: string
          example: demo-only
        demoRows:
          type: array
          items:
            type: string
    FacebookPublishResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - PUBLISHED
            - SKIPPED_ALREADY_PUBLISHED
            - SKIPPED_NO_DIGEST
        message:
          type: string
