openapi: 3.0.3
info:
  title: API for Polish Sejm
  version: "1.0"
servers:
- url: https://api.sejm.gov.pl/
- url: http://api.sejm.gov.pl/
tags:
- description: "MPs (pl: posłowie)."
  name: MP
- description: Bills or draft resolutions
  name: bills
- description: "Clubs in the Sejm (pl: kluby i koła)."
  name: clubs
- description: "Committees in the Sejm (pl: komisje sejmowe)."
  name: committees
- description: Bilateral Groups.
  name: groups
- description: "Interpellations (pl: interpelacje)."
  name: interpellations
- description: "Prints issued by the Sejm (pl: druki sejmowe)."
  name: prints
- description: "Proceedings of the Sejm (pl: Posiedzenia Sejmu)."
  name: proceedings
- description: "Information about a legislation process (pl: proces legislacyjny)."
  name: processes
- description: Transcripts
  name: transcripts
- description: "Videos (pl: transmisje wideo)."
  name: videos
- description: Votings.
  name: votings
- description: "Written questions (pl: zapytania)."
  name: written questions
paths:
  /sejm/term:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Term"
                type: array
          description: a list of terms
      summary: Returns a list of terms
      x-accepts:
      - application/json
  /sejm/term{term}:
    get:
      parameters:
      - description: a term number
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
          description: information about a term
      summary: Returns information about a term
      x-accepts:
      - application/json
  /sejm/term{term}/MP:
    get:
      parameters:
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/MP"
                type: array
          description: a list of MPs
      summary: Returns a list of MPs
      tags:
      - MP
      x-accepts:
      - application/json
  /sejm/term{term}/MP/{id}:
    get:
      parameters:
      - description: an MP ID
        example: 123
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MP"
          description: an information about an MP
      summary: Returns an information about an MP
      tags:
      - MP
      x-accepts:
      - application/json
  /sejm/term{term}/MP/{id}/photo:
    get:
      parameters:
      - description: an MP ID
        example: 123
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          description: an MP photo
      summary: Returns an MP photo
      tags:
      - MP
      x-accepts:
      - application/json
  /sejm/term{term}/MP/{id}/photo-mini:
    get:
      parameters:
      - description: an MP ID
        example: 123
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          description: an MP photo in small size
      summary: Returns an MP photo in small size
      tags:
      - MP
      x-accepts:
      - application/json
  /sejm/term{term}/MP/{id}/votings/stats:
    get:
      parameters:
      - description: an MP ID
        example: 1
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: a Sejm term
        example: 10
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/VotingStat"
                type: array
          description: an information about votings for an MP
      summary: Returns statistics about votings for an MP
      tags:
      - MP
      x-accepts:
      - application/json
  /sejm/term{term}/MP/{id}/votings/{sitting}/{date}:
    get:
      parameters:
      - description: a date
        example: 2023-12-13
        explode: false
        in: path
        name: date
        required: true
        schema:
          $ref: "#/components/schemas/LocalDate"
        style: simple
      - description: an MP ID
        example: 1
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: a sitting number
        example: 1
        explode: false
        in: path
        name: sitting
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: a Sejm term
        example: 10
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/VoteMP"
                type: array
          description: an information about votings for an MP
      summary: Returns an information about votings for an MP
      tags:
      - MP
      x-accepts:
      - application/json
  /sejm/term{term}/bilateralGroups:
    get:
      parameters:
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Group"
                type: array
          description: a list of groups
      summary: Returns a list of bilateral groups
      tags:
      - groups
      x-accepts:
      - application/json
  /sejm/term{term}/bilateralGroups/{id}:
    get:
      parameters:
      - description: an ID of the group
        example: 1
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetails"
          description: a group details
      summary: Returns a groups details
      tags:
      - groups
      x-accepts:
      - application/json
  /sejm/term{term}/bills:
    get:
      parameters:
      - description: a Sejm term
        example: 10
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: filter only bills with consultation results
        explode: true
        in: query
        name: consultationResults
        required: false
        schema:
          type: boolean
        style: form
      - description: filter bills received after date
        explode: true
        in: query
        name: dateOfReceiptFrom
        required: false
        schema:
          $ref: "#/components/schemas/LocalDate"
        style: form
      - description: filter bills received before date
        explode: true
        in: query
        name: dateOfReceiptTo
        required: false
        schema:
          $ref: "#/components/schemas/LocalDate"
        style: form
      - description: filter bills aimed at implementing European Union law
        explode: true
        in: query
        name: euRelated
        required: false
        schema:
          type: boolean
        style: form
      - description: controls the maximum number of items that may be returned for
          a single request
        example: 50
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          exclusiveMinimum: true
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: controls the starting point within the collection of resource
          results
        example: 150
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          exclusiveMinimum: true
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: filter by print number
        explode: true
        in: query
        name: print
        required: false
        schema:
          type: string
        style: form
      - description: filter only bills with public consultation
        explode: true
        in: query
        name: publicConsultation
        required: false
        schema:
          type: boolean
        style: form
      - description: "sorts objects by specified field, to sort in descending order\
          \ add a minus sign before field name"
        example: -lastModified
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      - deprecated: true
        description: "sorts objects by specified field, to sort in descending order\
          \ add a minus sign before field name"
        example: -lastModified
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          type: string
        style: form
      - description: filter by status
        explode: true
        in: query
        name: status
        required: false
        schema:
          $ref: "#/components/schemas/BillStatus"
        style: form
      - description: filter bills or resolutions
        explode: true
        in: query
        name: submissionType
        required: false
        schema:
          $ref: "#/components/schemas/BillType"
        style: form
      - description: filter by part of a title
        example: podatku
        explode: true
        in: query
        name: title
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Bill"
                type: array
          description: a list of bills
      summary: Returns a list of bills
      tags:
      - bills
      x-accepts:
      - application/json
  /sejm/term{term}/clubs:
    get:
      parameters:
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Club"
                type: array
          description: a list of clubs
      summary: Returns a list of clubs
      tags:
      - clubs
      x-accepts:
      - application/json
  /sejm/term{term}/clubs/{id}:
    get:
      parameters:
      - description: a club ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"
          description: information about a club
      summary: Returns information about a club
      tags:
      - clubs
      x-accepts:
      - application/json
  /sejm/term{term}/clubs/{id}/logo:
    get:
      parameters:
      - description: a club id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                type: object
          description: a club image
      summary: Returns a club image
      tags:
      - clubs
      x-accepts:
      - image/jpeg
  /sejm/term{term}/clubs/{id}/members:
    get:
      parameters:
      - description: a club ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Member"
                type: array
          description: list of members
      summary: Returns members of this club (current and past)
      tags:
      - clubs
      x-accepts:
      - application/json
  /sejm/term{term}/committees:
    get:
      parameters:
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Committee"
                type: array
          description: a list of committees
      summary: Returns a list of committees
      tags:
      - committees
      x-accepts:
      - application/json
  /sejm/term{term}/committees/sittings/{date}:
    get:
      parameters:
      - description: a date
        example: 2025-05-20
        explode: false
        in: path
        name: date
        required: true
        schema:
          $ref: "#/components/schemas/LocalDate"
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: also include cancelled sittings
        example: false
        explode: true
        in: query
        name: cancelled
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CommitteeSitting"
                type: array
          description: a list of sittings
      summary: Returns a list of sittings for a given date
      tags:
      - committees
      x-accepts:
      - application/json
  /sejm/term{term}/committees/{code}:
    get:
      parameters:
      - description: a committee code
        example: ASW
        explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Committee"
          description: a committee details
      summary: Returns a committee details
      tags:
      - committees
      x-accepts:
      - application/json
  /sejm/term{term}/committees/{code}/members:
    get:
      parameters:
      - description: a committee code
        example: ASW
        explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Member"
                type: array
          description: a list of members
      summary: Returns a list of members (current and past)
      tags:
      - committees
      x-accepts:
      - application/json
  /sejm/term{term}/committees/{code}/sittings:
    get:
      parameters:
      - description: a committee code
        example: ASW
        explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: also include cancelled sittings
        example: false
        explode: true
        in: query
        name: cancelled
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CommitteeSitting"
                type: array
          description: a list of sittings
      summary: Returns a list of sittings
      tags:
      - committees
      x-accepts:
      - application/json
  /sejm/term{term}/committees/{code}/sittings/{num}:
    get:
      parameters:
      - description: a committee code
        example: ASW
        explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      - description: a sitting number
        example: 1
        explode: false
        in: path
        name: num
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitteeSitting"
          description: a sitting
      summary: Returns details about a sitting
      tags:
      - committees
      x-accepts:
      - application/json
  /sejm/term{term}/committees/{code}/sittings/{num}/html:
    get:
      parameters:
      - description: a committee code
        example: ASW
        explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      - description: a sitting number
        example: 1
        explode: false
        in: path
        name: num
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          content:
            text/html; charset=UTF-8:
              schema:
                type: string
          description: a sitting transcript
      summary: Returns transcript of the meeting in the HTML format
      tags:
      - committees
      x-accepts:
      - text/html; charset=UTF-8
  /sejm/term{term}/committees/{code}/sittings/{num}/pdf:
    get:
      parameters:
      - description: a committee code
        example: ASW
        explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      - description: a sitting number
        example: 1
        explode: false
        in: path
        name: num
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          description: a sitting transcript
      summary: Returns transcript of the meeting in the PDF format
      tags:
      - committees
      x-accepts:
      - application/json
  /sejm/term{term}/interpellations:
    get:
      parameters:
      - description: a Sejm term
        example: 9
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: display only cases where an answer delayed
        explode: true
        in: query
        name: delayed
        required: false
        schema:
          type: boolean
        style: form
      - description: filters interpellations from a MP with a specified ID
        example: 10
        explode: true
        in: query
        name: from
        required: false
        schema:
          type: string
        style: form
      - description: controls the maximum number of items that may be returned for
          a single request
        example: 50
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          exclusiveMinimum: true
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: filters interpellations modified since specified date
        example: 2022-09-07T14:58:28
        explode: true
        in: query
        name: modifiedSince
        required: false
        schema:
          $ref: "#/components/schemas/LocalDateTime"
        style: form
      - description: controls the starting point within the collection of resource
          results
        example: 150
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          exclusiveMinimum: true
          format: int32
          minimum: 0
          type: integer
        style: form
      - description: filters interpellations starting from a specified date
        example: 2022-01-15
        explode: true
        in: query
        name: since
        required: false
        schema:
          type: string
        style: form
      - description: "sorts objects by specified field, to sort in descending order\
          \ add a minus sign before field name"
        example: -lastModified
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      - deprecated: true
        description: "sorts objects by specified field, to sort in descending order\
          \ add a minus sign before field name"
        example: -lastModified
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          type: string
        style: form
      - description: filters interpellations starting before a specified date
        example: 2022-01-25
        explode: true
        in: query
        name: till
        required: false
        schema:
          type: string
        style: form
      - description: filters interpellations containing a specified string in a title
        example: kodeksu pracy
        explode: true
        in: query
        name: title
        required: false
        schema:
          type: string
        style: form
      - description: filters interpellations sent to a specified recipient
        example: minister finansów
        explode: true
        in: query
        name: to
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Interpellation"
                type: array
          description: a list of interpellations
      summary: Returns a list of interpellations
      tags:
      - interpellations
      x-accepts:
      - application/json
  /sejm/term{term}/interpellations/attachment/{key}/{fileName}:
    get:
      parameters:
      - description: a name of the attachment
        example: i01258-o1.pdf
        explode: false
        in: path
        name: fileName
        required: true
        schema:
          type: string
        style: simple
      - description: an attachment identifier
        example: ATTD2VJHU
        explode: false
        in: path
        name: key
        required: true
        schema:
          type: string
        style: simple
      - description: a Sejm term
        example: 10
        explode: false
        in: path
        name: term
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          description: an attachment
      summary: Returns an attachment file
      tags:
      - interpellations
      x-accepts:
      - application/json
  /sejm/term{term}/interpellations/{num}:
    get:
      parameters:
      - description: an interpellation number
        example: 190
        explode: false
        in: path
        name: num
